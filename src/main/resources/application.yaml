spring:
  application:
    name: ITJobAPI

  datasource:
    url: ${CONNECTION_STRING}
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.debug: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  secure: true

app:
  base-url: ${BASE_URL}
  verify:
    candidate: ${VERIFY_TOKEN_CANDIDATE}
    employer: ${VERIFY_TOKEN_EMPLOYER}
  front-end:
    verified-candidate-url: ${VERIFIED_CANDIDATE_URL}
    verified-company-url: ${VERIFIED_EMPLOYER_URL}
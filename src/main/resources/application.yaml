spring:
  application:
    name: ITJobAPI

  datasource:
    url: ${CONNECTION_STRING}
    username: root
    password: ${CONNECTION_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.debug: true
      
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  secure: true

app:
  base-url: ${BASE_URL}
  verify:
    candidate: ${VERIFY_TOKEN_CANDIDATE}
    employer: ${VERIFY_TOKEN_EMPLOYER}
  front-end:
    fe-url: ${FE_URL}
    verified-candidate-url: ${VERIFIED_CANDIDATE_URL}
    verified-company-url: ${VERIFIED_EMPLOYER_URL}
    verified-url: ${VERIFIED_URL}

vnpay:
  tmn-code: ${TMN_CODE}
  api-url: ${API_URL}
  return-url: ${BASE_URL}${RETURN_URL}
  secret-key: ${SECRET_KEY}
  pay-url: ${PAY_URL}
  version: 2.1.0
  command: pay
  currency-code: VND
  locale: vn



services:
  it-job-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: wdibao/it-job-api:lastest
    ports:
      - "8080:8080"
    restart: on-failure
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - it-job-network

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${CONNECTION_PASSWORD}
      - MYSQL_DATABASE=itjob_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - it-job-network
    command: --bind-address=0.0.0.0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${CONNECTION_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:

networks:
  it-job-network:
    driver: bridge
